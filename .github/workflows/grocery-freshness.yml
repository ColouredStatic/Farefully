name: Grocery snapshot freshness
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/grocery-freshness.mjs'
      - 'app/live-prices.json'
      - '.github/workflows/grocery-freshness.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit observation timestamps
        run: |
          set -o pipefail
          node scripts/grocery-freshness.mjs | tee -a "$GITHUB_STEP_SUMMARY"
