name: Open Prices feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/open-prices-feasibility.mjs'
      - '.github/workflows/open-prices-feasibility.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Count recent GBP observations
        run: |
          set -o pipefail
          node scripts/open-prices-feasibility.mjs | tee -a "$GITHUB_STEP_SUMMARY"
