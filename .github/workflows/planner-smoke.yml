name: Farefully planner smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'app/app.js'
      - 'app/index.html'
      - 'index.html'
      - 'assets/styles.css'
      - 'tests/plus-basket-smoke.mjs'
      - 'tests/plus-shopping-tools-smoke.mjs'
      - 'tests/basket-layout-smoke.mjs'
      - 'tests/early-access-copy-smoke.mjs'
      - 'tests/design-polish-smoke.mjs'
      - 'tests/palette-contrast-smoke.mjs'
      - 'tests/planner-startup-smoke.mjs'
      - 'tests/plus-plan-access-smoke.mjs'
      - 'tests/launch-readiness-smoke.mjs'
      - 'app/manifest.webmanifest'
      - 'app/install.html'
      - 'app/icons/**'
      - 'tests/household-fit-smoke.mjs'
      - 'tests/basket-quantity-variety-smoke.mjs'
      - 'tests/recipe-photography-smoke.mjs'
      - '.github/workflows/planner-smoke.yml'
  pull_request:
    paths:
      - 'app/app.js'
      - 'app/index.html'
      - 'index.html'
      - 'assets/styles.css'
      - 'tests/plus-basket-smoke.mjs'
      - 'tests/plus-shopping-tools-smoke.mjs'
      - 'tests/basket-layout-smoke.mjs'
      - 'tests/early-access-copy-smoke.mjs'
      - 'tests/design-polish-smoke.mjs'
      - 'tests/palette-contrast-smoke.mjs'
      - 'tests/planner-startup-smoke.mjs'
      - 'tests/plus-plan-access-smoke.mjs'
      - 'tests/launch-readiness-smoke.mjs'
      - 'app/manifest.webmanifest'
      - 'app/install.html'
      - 'app/icons/**'
      - 'tests/household-fit-smoke.mjs'
      - 'tests/basket-quantity-variety-smoke.mjs'
      - 'tests/recipe-photography-smoke.mjs'
      - '.github/workflows/planner-smoke.yml'
  workflow_dispatch:

concurrency:
  group: farefully-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  planner-smoke:
    name: Planner loads and basket renders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application JavaScript syntax
        run: node --check app/app.js
      - name: Validate Plus basket and homepage plans
        run: node tests/plus-basket-smoke.mjs
      - name: Verify Farefully premium palette and contrast
        run: node tests/palette-contrast-smoke.mjs
      - name: Verify shared design styling and accessible navigation
        run: node tests/design-polish-smoke.mjs
      - name: Verify Early Access copy and safety notices
        run: node tests/early-access-copy-smoke.mjs
      - name: Test refined Basket layout and header
        run: node tests/basket-layout-smoke.mjs
      - name: Test Plus two-trip shopping, aisle settings and actual spend
        run: node tests/plus-shopping-tools-smoke.mjs
      - name: Validate mobile installation and recipe catalogue
        run: node tests/launch-readiness-smoke.mjs
      - name: Verify Free and Plus plan generation entitlements
        run: node tests/plus-plan-access-smoke.mjs
      - name: Test logged-in planner, basket and reset flow
        run: node tests/planner-startup-smoke.mjs
      - name: Test household fit labels and explanations
        run: node tests/household-fit-smoke.mjs
      - name: Test shopping quantities and meal variety
        run: node tests/basket-quantity-variety-smoke.mjs
      - name: Test recipe photo assignment and fallback
        run: node tests/recipe-photography-smoke.mjs
