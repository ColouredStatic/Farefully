.recipeback{border:none;background:none;color:var(--green);font-weight:800;padding:0;margin:2px 0 14px}

  background:linear-gradient(135deg,#edf6ef,#fff8f0)
}

  flex:0 0 auto;border:none;border-radius:999px;background:var(--green);color:#fff;
  padding:10px 13px;font-weight:800
}

}

}
